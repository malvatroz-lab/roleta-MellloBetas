
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MelloBetas Analise de Roleta</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
    <style>
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.3; }
      }
      @keyframes scaleUp {
        0% { transform: scale(0.5); opacity: 0; }
        100% { transform: scale(1); opacity: 1; }
      }
      .animate-blink {
        animation: blink 1s infinite;
      }
      .scale-up-animation {
        animation: scaleUp 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
      }
      .text-glow {
        text-shadow: 0 0 10px rgba(255,255,255,0.3);
      }
      body {
        background-image: linear-gradient(rgba(6, 9, 15, 0.85), rgba(6, 9, 15, 0.85)), url('https://images.unsplash.com/photo-1596838132731-3301c3fd4317?q=80&w=2070&auto=format&fit=crop');
        background-size: cover;
        background-position: center;
        background-attachment: fixed;
        color: #f8fafc;
        font-family: 'Inter', sans-serif;
        min-height: 100vh;
      }
      .font-mono {
        font-family: 'JetBrains Mono', monospace;
      }
      .bg-card {
        background-color: rgba(15, 22, 36, 0.7);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
      }
      .border-accent {
        border-color: rgba(30, 41, 59, 0.5);
      }
      .text-neon-green {
        color: #00ff88;
        text-shadow: 0 0 10px rgba(0, 255, 136, 0.5);
      }
      .bg-neon-green {
        background-color: #00ff88;
      }
      .shadow-neon-green {
        box-shadow: 0 0 20px rgba(0, 255, 136, 0.2);
      }
      .shadow-neon-sky {
        box-shadow: 0 0 20px rgba(14, 165, 233, 0.2);
      }
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(30, 41, 59, 0.8);
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #334155;
      }
      .custom-scroll::-webkit-scrollbar {
        width: 4px;
      }
    </style>
